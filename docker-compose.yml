# Local development dependencies only. Production uses managed services.
services:
  postgres:
    image: postgres:16-alpine
    container_name: noc-postgres
    environment:
      POSTGRES_DB: noc_test
      POSTGRES_USER: noc
      POSTGRES_PASSWORD: noc_local_password
    ports:
      - '5432:5432'
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U noc -d noc_test']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible store for run artifacts (screenshots, traces, exports).
  minio:
    image: minio/minio:latest
    container_name: noc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./minio-data:/data
