[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Each application's automations live in their own folder, so pytest is pointed
# at all of them rather than a single tests/ directory.
testpaths =
    magen_elyon_automations
    harmony_automations
    gaussian_automations
    butterfly_effect_automations
    general_automations

# --strict-markers turns a typo in a marker name into an error rather than a
# silently-unfiltered run.
#
# HTML reporting is deliberately not here: baking an optional plugin's flag into
# the base config makes a bare `pytest` fail whenever that plugin is absent.
addopts =
    --strict-markers
    --tb=short
    -ra

markers =
    smoke: the main automation for an application
    regression: secondary automations
    general: environment-wide checks, not tied to an application

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
